name: Deploy Pages with retry
description: |
  Wraps actions/deploy-pages (v5.0.1) with retries for transient GitHub Pages API
  failures (e.g. "Deployment failed, try again later."). Only the promote step
  is retried — build and upload steps are unchanged.
outputs:
  page_url:
    description: Deployed site URL
    value: ${{ steps.deploy.outputs.page_url }}
runs:
  using: composite
  steps:
    - name: Promote artifact to GitHub Pages (retry)
      id: deploy
      uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
      with:
        action: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        attempt_limit: 3
        attempt_delay: 45000
