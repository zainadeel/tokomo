name: Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Install focus-test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Test global focus in browsers
        run: npm run test:browser

      - name: Build docs
        run: npm run build:docs

      - name: Verify dist artifacts
        run: |
          for f in \
            dist/index.css \
            dist/colors.css \
            dist/dimensions.css \
            dist/typography.css \
            dist/effects.css \
            dist/reset.css \
            dist/globals.css \
            dist/tokens.json \
            dist/tokens-index.json \
            dist/json/colors.modes.json \
            dist/mobile/manifest.json \
            dist/mobile/tokens/colors/reference/hex.tokens.json \
            dist/mobile/tokens/colors/semantic/light.tokens.json \
            dist/mobile/tokens/colors/semantic/dark.tokens.json \
            dist/mobile/tokens/colors/data/light.tokens.json \
            dist/mobile/tokens/colors/data/dark.tokens.json \
            dist/mobile/tokens/effects/value.tokens.json \
            dist/mobile/tokens/dimensions/mobile/value.tokens.json \
            dist/mobile/tokens/typography/mobile/value.tokens.json \
            dist/mobile/tokens/typography/mobile/semantic.tokens.json \
            dist/agent.json \
            dist/agent.mjs \
            dist/agent.d.ts \
            dist/agent.schema.json \
            dist/index.mjs \
            dist/index.cjs \
            dist/index.d.ts; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing expected output: $f"
              exit 1
            fi
          done
          echo "✅ All expected dist files present."

      - name: Verify src/ was not mutated by build
        run: |
          if [ -n "$(git status --porcelain src/)" ]; then
            echo "❌ Build mutated src/ — this should never happen:"
            git diff src/
            exit 1
          fi
          echo "✅ src/ is clean."
