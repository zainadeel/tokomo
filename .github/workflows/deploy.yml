name: Deploy token browser to GitHub Pages

on:
  workflow_call:
    inputs:
      ref:
        description: Git tag or SHA to build and deploy (defaults to the triggering commit)
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or SHA to build and deploy (optional — defaults to main)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only this job deploys, so only it gets Pages and OIDC write access.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install dependencies
        run: npm ci

      - name: Build tokens
        run: npm run build

      - name: Build docs
        run: npm run build:docs

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: ./.github/actions/retry-deploy-pages
