<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>TokoMo — Tokens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- Inlined token CSS — enables live var() resolution for swatches/previews -->
  <style>/* @@TOKEN_CSS@@ */</style>

  <!-- Token data injected by build-docs.mjs -->
  <script>/* @@TOKEN_DATA@@ */</script>

  <style>
    /* ── UI design tokens ─────────────────────────────────────────────── */
    :root {
      --bg:       #ffffff;
      --fg:       #000000;
      --fg-muted: rgb(0 0 0 / 0.5);
      --divider:  rgb(0 0 0 / 0.1);
      color-scheme: light;
    }
    [data-theme="dark"] {
      --bg:       #000000;
      --fg:       #ffffff;
      --fg-muted: rgb(255 255 255 / 0.5);
      --divider:  rgb(255 255 255 / 0.1);
      color-scheme: dark;
    }

    /* ── Reset / base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    ::selection { background: var(--divider); color: inherit; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      font-size: 12px;
      line-height: 16px;
      min-height: 100dvh;
    }

    /* ── Toolbar ──────────────────────────────────────────────────────── */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: auto auto 1fr;
      align-items: center;
      gap: 16px;
      height: 48px;
      padding: 0 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--divider);
    }

    .logo {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .primary-nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .toolbar a.toggle-btn { text-decoration: none; }

    /* ── Search ───────────────────────────────────────────────────────── */
    .search-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .search-wrap.hidden { display: none; }
    .search {
      width: 0; /* driven by JS sizer */
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--fg);
      font-size: 12px;
      line-height: 16px;
      font-family: inherit;
      text-align: left;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .search::placeholder { color: var(--fg-muted); }
    .search::-webkit-search-cancel-button { -webkit-appearance: none; }
    .search-count {
      font-size: 12px;
      line-height: 16px;
      color: var(--fg-muted);
      white-space: nowrap;
      display: none;
    }
    .search-count.visible { display: block; }

    /* ── Controls ─────────────────────────────────────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      justify-content: flex-end;
    }
    .text-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toggle-btn {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      color: var(--fg-muted);
      line-height: 1;
      white-space: nowrap;
    }
    .toggle-btn.active { color: var(--fg); }
    .vdivider {
      width: 1px;
      height: 12px;
      background: var(--divider);
      flex-shrink: 0;
    }

    /* ── Sub-toolbar (group filters) ──────────────────────────────────── */
    .sub-toolbar {
      position: sticky;
      top: 48px;
      z-index: 19;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 48px;
      padding: 0 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--divider);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .sub-toolbar::-webkit-scrollbar { display: none; }

    .sub-btn {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      color: var(--fg-muted);
      white-space: nowrap;
      line-height: 1;
      flex-shrink: 0;
    }
    .sub-btn.active { color: var(--fg); }
    .sub-separator {
      width: 1px;
      height: 12px;
      background: var(--divider);
      flex: 0 0 auto;
    }
    /* While searching, tabs are bypassed — hide the sub-toolbar entirely. */
    .sub-toolbar.searching { display: none; }

    /* ── Content ──────────────────────────────────────────────────────── */
    #content {
      padding: 10px 12px 64px;
    }

    /* ── Documentation ────────────────────────────────────────────────── */
    #content.documentation {
      max-width: 900px;
      margin: 0;
      padding: 48px 24px 96px;
    }
    .doc-page-header {
      padding-bottom: 48px;
    }
    .doc-page-header > .doc-kicker,
    .doc-page-header > h1,
    .doc-page-header > p {
      max-width: 760px;
    }
    .doc-kicker {
      color: var(--fg-muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .doc-page-header h1 {
      margin-top: 12px;
      font-size: 36px;
      line-height: 42px;
      letter-spacing: -0.03em;
    }
    .doc-page-header p {
      margin-top: 16px;
      color: var(--fg-muted);
      font-size: 15px;
      line-height: 24px;
    }
    .doc-section {
      scroll-margin-top: 112px;
      border-top: 1px solid var(--divider);
      padding: 40px 0 56px;
    }
    #content.documentation > .doc-section:first-child {
      border-top: 0;
      padding-top: 0;
    }
    .doc-section-header {
      max-width: 760px;
      margin-bottom: 24px;
    }
    .doc-section h2 {
      margin-top: 8px;
      font-size: 24px;
      line-height: 32px;
      letter-spacing: -0.02em;
    }
    .doc-section-header > p,
    .doc-card > p,
    .doc-recipe > p {
      margin-top: 8px;
      color: var(--fg-muted);
      font-size: 13px;
      line-height: 20px;
    }
    .doc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    .doc-grid-two-columns {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .doc-flow {
      list-style: none;
      border-top: 1px solid var(--divider);
    }
    .doc-flow li {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 16px;
      padding: 18px 0;
      border-bottom: 1px solid var(--divider);
    }
    .doc-flow-index {
      color: var(--fg-muted);
      font-family: 'SF Mono', ui-monospace, monospace;
      font-size: 10px;
    }
    .doc-flow h3 {
      font-size: 15px;
      line-height: 20px;
    }
    .doc-flow p {
      margin-top: 4px;
      color: var(--fg-muted);
      font-size: 13px;
      line-height: 20px;
    }
    .doc-axis-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 24px;
    }
    .doc-axis-card {
      border: 1px solid var(--divider);
      padding: 18px;
    }
    .doc-axis-card h3,
    .doc-tone-card h3,
    .doc-callout h3 {
      margin-top: 6px;
      font-size: 15px;
      line-height: 20px;
    }
    .doc-axis-card p,
    .doc-tone-card p,
    .doc-callout p {
      margin-top: 8px;
      color: var(--fg-muted);
      font-size: 13px;
      line-height: 20px;
    }
    .doc-tone-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .doc-tone-card {
      border: 1px solid var(--divider);
      padding: 16px;
      min-width: 0;
    }
    .doc-tone-note {
      margin-top: 16px;
      color: var(--fg-muted);
      font-size: 12px;
      line-height: 19px;
    }
    .doc-distinction-list {
      border-top: 1px solid var(--divider);
    }
    .doc-distinction {
      display: grid;
      grid-template-columns: minmax(160px, 0.35fr) minmax(0, 1fr);
      gap: 24px;
      padding: 16px 0;
      border-bottom: 1px solid var(--divider);
    }
    .doc-distinction h3 {
      font-size: 13px;
      line-height: 20px;
    }
    .doc-distinction p {
      color: var(--fg-muted);
      font-size: 13px;
      line-height: 20px;
    }
    .doc-intent-group + .doc-intent-group { margin-top: 40px; }
    .doc-intent-group-header {
      max-width: 760px;
      margin-bottom: 12px;
    }
    .doc-intent-group-header h3 {
      font-size: 17px;
      line-height: 24px;
    }
    .doc-intent-group-header p {
      margin-top: 4px;
      color: var(--fg-muted);
      font-size: 12px;
      line-height: 18px;
    }
    .doc-callout {
      border: 1px solid var(--divider);
      padding: 18px;
    }
    .doc-role-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .doc-role-card {
      border: 1px solid var(--divider);
      padding: 18px;
    }
    .doc-role-card h3 {
      margin-top: 6px;
      font-size: 15px;
      line-height: 20px;
    }
    .doc-role-card p {
      margin-top: 8px;
      color: var(--fg-muted);
      font-size: 12px;
      line-height: 18px;
    }
    .doc-category-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .doc-category-card {
      min-width: 0;
      border: 1px solid var(--divider);
      border-radius: 0;
      padding: 16px;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      appearance: none;
    }
    .doc-category-card:hover { border-color: var(--fg-muted); }
    .doc-category-card.active { border-color: var(--fg); }
    .doc-category-card:focus-visible {
      outline: 1px solid var(--fg);
      outline-offset: 2px;
    }
    .doc-category-card h3 {
      font-size: 14px;
      line-height: 20px;
    }
    .doc-category-card p {
      margin-top: 6px;
      color: var(--fg-muted);
      font-size: 11px;
      line-height: 17px;
    }
    .doc-category-count {
      display: block;
      margin-top: 12px;
      color: var(--fg-muted);
      font: 10px 'SF Mono', ui-monospace, monospace;
    }
    .doc-family-reference {
      margin-top: 40px;
      padding-top: 40px;
      border-top: 1px solid var(--divider);
    }
    .doc-family-reference > .doc-callout { margin-bottom: 32px; }
    .doc-family-group + .doc-family-group { margin-top: 40px; }
    .doc-family-group-header {
      max-width: 760px;
      margin-bottom: 12px;
    }
    .doc-family-group-header h3 {
      font-size: 17px;
      line-height: 24px;
    }
    .doc-family-group-header p {
      margin-top: 4px;
      color: var(--fg-muted);
      font-size: 12px;
      line-height: 18px;
    }
    .doc-family-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 12px;
      align-items: start;
    }
    .doc-family-card {
      min-width: 0;
      border: 1px solid var(--divider);
      padding: 18px;
    }
    .doc-family-card h3 {
      margin-top: 6px;
      font-size: 15px;
      line-height: 20px;
    }
    .doc-family-card > p {
      margin-top: 8px;
      color: var(--fg-muted);
      font-size: 12px;
      line-height: 18px;
    }
    .doc-family-card h4 {
      margin-top: 18px;
      color: var(--fg-muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .doc-family-recipes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .doc-family-recipes button,
    .doc-inline-action {
      border: 1px solid var(--divider);
      border-radius: 0;
      padding: 4px 7px;
      background: transparent;
      color: var(--fg);
      font: inherit;
      font-size: 10px;
      cursor: pointer;
      appearance: none;
    }
    .doc-family-recipes button:hover,
    .doc-inline-action:hover { border-color: var(--fg-muted); }
    .doc-inline-action { margin-top: 14px; }
    .doc-recipe-category-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .doc-recipe-browser {
      margin-top: 40px;
      padding-top: 40px;
      border-top: 1px solid var(--divider);
    }
    .doc-recipe-selector-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }
    .doc-recipe-selector {
      min-width: 0;
      border: 1px solid var(--divider);
      border-radius: 0;
      padding: 16px;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      appearance: none;
    }
    .doc-recipe-selector:hover { border-color: var(--fg-muted); }
    .doc-recipe-selector.active { border-color: var(--fg); }
    .doc-recipe-selector:focus-visible {
      outline: 1px solid var(--fg);
      outline-offset: 2px;
    }
    .doc-recipe-selector h3 {
      font-size: 14px;
      line-height: 20px;
    }
    .doc-recipe-selector p {
      margin-top: 6px;
      color: var(--fg-muted);
      font-size: 11px;
      line-height: 17px;
    }
    .doc-recipe-detail {
      margin-top: 40px;
      padding-top: 40px;
      border-top: 1px solid var(--divider);
    }
    .doc-recipe-browser.single .doc-recipe-detail {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }
    .doc-recipe-heading {
      max-width: 760px;
    }
    .doc-recipe-heading h2 {
      margin-top: 8px;
      font-size: 24px;
      line-height: 32px;
      letter-spacing: -0.02em;
    }
    .doc-recipe-heading p,
    .doc-recipe-rule p {
      margin-top: 8px;
      color: var(--fg-muted);
      font-size: 13px;
      line-height: 20px;
    }
    .doc-recipe-rule {
      margin-top: 24px;
      border: 1px solid var(--divider);
      padding: 18px;
    }
    .doc-recipe-rule h3 {
      margin-top: 6px;
      font-size: 15px;
      line-height: 20px;
    }
    .doc-recipe-section {
      margin-top: 40px;
      padding-top: 40px;
      border-top: 1px solid var(--divider);
    }
    .doc-recipe-section > h3,
    .doc-recipe-section .doc-columns h3,
    .doc-recipe-variant-header h3 {
      font-size: 17px;
      line-height: 24px;
    }
    .doc-recipe-detail h4 {
      margin-top: 18px;
      color: var(--fg-muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .doc-recipe-variant-group + .doc-recipe-variant-group { margin-top: 32px; }
    .doc-recipe-variant-header { margin-bottom: 12px; }
    .doc-recipe-variant-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .doc-destination {
      width: 100%;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      appearance: none;
      border-radius: 0;
    }
    .doc-destination:hover { border-color: var(--fg-muted); }
    .doc-destination:focus-visible {
      outline: 1px solid var(--fg);
      outline-offset: 2px;
    }
    .doc-card,
    .doc-recipe {
      border: 1px solid var(--divider);
      padding: 18px;
      min-width: 0;
    }
    .doc-card h3,
    .doc-recipe h3 {
      margin-top: 6px;
      font-size: 15px;
      line-height: 20px;
    }
    .doc-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }
    .doc-pill {
      border: 1px solid var(--divider);
      padding: 2px 6px;
      color: var(--fg-muted);
      font-size: 10px;
      line-height: 16px;
    }
    .doc-card h4,
    .doc-recipe h4 {
      margin-top: 18px;
      color: var(--fg-muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .doc-list {
      margin: 8px 0 0 18px;
      color: var(--fg-muted);
      font-size: 12px;
      line-height: 18px;
    }
    .doc-list li + li { margin-top: 5px; }
    .doc-token-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .doc-token-list code,
    .doc-assignment code,
    .doc-code {
      font-family: 'SF Mono', ui-monospace, monospace;
      font-size: 10px;
    }
    .doc-token-list code {
      padding: 3px 6px;
      background: var(--divider);
      overflow-wrap: anywhere;
    }
    .doc-recipe { margin-top: 12px; }
    .doc-recipe:first-of-type { margin-top: 0; }
    .doc-columns {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }
    .doc-columns > :only-child { grid-column: 1 / -1; }
    .doc-variants {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .doc-variant {
      background: color-mix(in srgb, var(--divider) 45%, transparent);
      padding: 12px;
    }
    .doc-variant-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .doc-variant-title span {
      color: var(--fg-muted);
      font-size: 10px;
      font-weight: 400;
    }
    .doc-assignment {
      display: grid;
      grid-template-columns: minmax(84px, auto) 1fr;
      gap: 8px;
      margin-top: 7px;
      color: var(--fg-muted);
      font-size: 10px;
      line-height: 15px;
    }
    .doc-assignment code {
      color: var(--fg);
      overflow-wrap: anywhere;
    }
    .doc-code {
      margin-top: 10px;
      padding: 12px;
      overflow-x: auto;
      white-space: pre;
      background: var(--divider);
      color: var(--fg);

    }
    .doc-reference {
      color: var(--fg);
      text-underline-offset: 2px;
    }

    @media (max-width: 760px) {
      .toolbar { grid-template-columns: auto 1fr; gap: 12px; padding: 0 12px; }
      .primary-nav { justify-self: end; }
      .controls { display: none; }
      .sub-toolbar { padding-inline: 12px; }
      #content.documentation { padding: 32px 16px 72px; }
      .doc-page-header h1 { font-size: 28px; line-height: 34px; }
      .doc-axis-grid,
      .doc-tone-grid,
      .doc-grid-two-columns,
      .doc-role-grid,
      .doc-category-grid,
      .doc-family-grid,
      .doc-recipe-category-grid,
      .doc-recipe-selector-grid,
      .doc-recipe-variant-grid { grid-template-columns: 1fr; }
      .doc-distinction { grid-template-columns: 1fr; gap: 4px; }
      .doc-columns { grid-template-columns: 1fr; }
    }

    /* ── Color grid ───────────────────────────────────────────────────── */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
      gap: 2px;
    }
    /* The extra left padding (on top of the base 12px) indents both the
       category headers and the swatches by the same 8px — so the card's hover
       fills flush with the swatch. #content.color-grid beats #content alone. */
    #content.color-grid { padding-left: 20px; }
    /* Category header spans the full grid row, forcing a line break. */
    .color-group-header {
      grid-column: 1 / -1;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--fg-muted);
      padding: 20px 8px 6px 0;
    }
    .color-group-header:first-child { padding-top: 8px; }

    .color-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      outline: none;
      -webkit-user-select: none;
      user-select: none;
      border-radius: 0;
      position: relative;
    }
    /* Zero-height full-row element used to force a line break between dark
       and light shade rows within the same hue family. */
    .color-row-break {
      grid-column: 1 / -1;
      height: 0;
    }
    .color-card:hover,
    .color-card:focus-visible {
      background: var(--divider);
    }
    .color-card:focus-visible {
      box-shadow: inset 0 0 0 2px var(--fg);
    }

    .color-swatch {
      height: 36px;
      position: relative;
    }
    /* Checkerboard sits behind the color — only visible through transparent swatches */
    .color-swatch::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-conic-gradient(
        rgb(0 0 0 / 0.06) 0% 25%, transparent 0% 50%
      );
      background-size: 8px 8px;
    }
    /* Actual color renders on top — covers checkerboard for opaque tokens */
    .color-swatch::after {
      content: '';

      font-weight: 600;
      letter-spacing: 0.06em;

      display: grid;
      grid-template-columns: 180px 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 5px 8px;

      -webkit-user-select: none;

      background: var(--divider);
    }

      display: flex;
      align-items: center;
      overflow: visible;
    }

    /* Name column */
    .tok-name {
      font-size: 12px;
      color: var(--fg);
      font-family: 'SF Mono', ui-monospace, 'Fira Code', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      font-size: 12px;
      color: var(--fg-muted);

      height: 6px;
      position: relative;

      height: 100%;
      background: var(--fg);

      height: 100%;
      background: var(--fg-muted);
      min-width: 1px;
    }

    .dim-radius-box {
      width: 40px;
      height: 40px;
      border: 1px solid var(--fg);
      flex-shrink: 0;

    .dim-stroke-line {

    /* ── Effect visuals ───────────────────────────────────────────────── */
    .fx-duration-track {
      width: 160px;
      height: 4px;
      background: var(--divider);
      position: relative;
      flex-shrink: 0;
    }
    .fx-duration-fill {
      height: 100%;
      background: var(--fg);
    }

    .fx-opacity-box {
      width: 32px;
      height: 20px;
      background: var(--fg);
      flex-shrink: 0;
    }

    .fx-blur-box {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--fg-muted);
      flex-shrink: 0;
    }

    .fx-elevation-box {
      width: 32px;
      height: 20px;
      border-radius: 0;
      background: var(--bg);
      flex-shrink: 0;
    }

    .fx-swatch {
      width: 32px;
      height: 20px;
      border-radius: 0;
      flex-shrink: 0;
      background-color: #fff;
      background-image:
        linear-gradient(45deg, rgba(0,0,0,0.08) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(0,0,0,0.08) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(0,0,0,0.08) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(0,0,0,0.08) 75%);
      background-size: 8px 8px;
      background-position: 0 0, 0 4px, 4px -4px, -4px 0;
      box-shadow: inset 0 0 0 1px var(--border);
      position: relative;
      overflow: hidden;
    }

    .fx-swatch-fill {
      position: absolute;
      inset: 0;
    }

    .fx-easing-label {
      font-size: 11px;
      color: var(--fg-muted);
      font-family: 'SF Mono', ui-monospace, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }

    /* ── Empty state ──────────────────────────────────────────────────── */
    .empty-state {
      padding: 64px 0;
      text-align: center;
      color: var(--fg-muted);
    }
    .empty-state p { font-size: 12px; }
    .empty-state small { font-size: 12px; opacity: 0.7; }

    /* ── Toast ────────────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--fg);
      color: var(--bg);
      padding: 8px 14px;
      border-radius: 0;
      font-size: 12px;
      font-family: 'SF Mono', ui-monospace, 'Fira Code', monospace;
      white-space: nowrap;
      max-width: calc(100vw - 40px);
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

}

});

  if (nextView === 'documentation' && view !== 'documentation') {
    documentationSection = 'overview';

  view = nextView;
  localStorage.setItem('tokomo-view', view);
  primaryNav.querySelectorAll('[data-view]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === view);

  render();
}

  if (nextSection === 'recipes' && documentationSection !== 'recipes') {
    recipeCategory = 'color';
    selectedRecipe = 'token-recipe:semantic-color-pairing';

  documentationSection = nextSection;
  updateSubToolbar();
  renderDocumentation();
  window.scrollTo({ top: 0, behavior: 'auto' });

  window.scrollTo({ top: 0, behavior: 'auto' });
}

  recipeCategory = category.id;
  selectedRecipe = category.defaultRecipe;

function openRecipe(nextRecipe) {
  const category = RECIPE_CATEGORIES.find(item => item.recipeIds.includes(nextRecipe));
  if (!category) return;
  recipeCategory = category.id;
  selectedRecipe = nextRecipe;
  documentationSection = 'recipes';
  updateSubToolbar();
  renderDocumentation();
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function switchSection(s) {
  section = s;
  group = 'all';
  query = '';
  searchEl.value = '';
  localStorage.setItem('tokomo-section', s);

  updateSubToolbar();
  updateSearchPlaceholder();
  syncSearchWidth();
  render();
}

// ── Sub-toolbar ───────────────────────────────────────────────────────────────

function updateSubToolbar() {
  subToolbar.innerHTML = '';
  subToolbar.classList.remove('searching');

  if (view === 'documentation') {
    subToolbar.setAttribute('aria-label', 'Documentation sections');
    for (const item of DOC_SECTIONS) {
      const btn = document.createElement('button');
      const isActive = item.id === documentationSection;
      btn.className = 'sub-btn' + (isActive ? ' active' : '');
      btn.textContent = item.label;
      btn.dataset.documentationSection = item.id;
      if (isActive) btn.setAttribute('aria-current', 'page');
      btn.addEventListener('click', () => switchDocumentationSection(item.id));
      subToolbar.appendChild(btn);
    }
    return;
  }

  subToolbar.setAttribute('aria-label', 'Token section and group filter');
  for (const item of SECTIONS) {
    const btn = document.createElement('button');
    btn.className = 'sub-btn' + (item.id === section ? ' active' : '');
    btn.textContent = item.label;
    btn.dataset.section = item.id;
    btn.addEventListener('click', () => switchSection(item.id));
    subToolbar.appendChild(btn);
  }

  const groups = GROUPS[section] || [];
  if (groups.length) {
    const separator = document.createElement('span');
    separator.className = 'sub-separator';
    separator.setAttribute('aria-hidden', 'true');
    subToolbar.appendChild(separator);
  }
  for (const g of groups) {
    const btn = document.createElement('button');
    btn.className = 'sub-btn' + (g.id === group ? ' active' : '');
    btn.textContent = g.label;
    btn.dataset.group = g.id;
    btn.addEventListener('click', () => {
      group = g.id;
      subToolbar.querySelectorAll('.sub-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.group === group);
      });
      render();
    });
    subToolbar.appendChild(btn);
  }
}

// ── Search ────────────────────────────────────────────────────────────────────

searchEl.addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase();
  syncSearchWidth();
  render();
});

function updateSearchPlaceholder() {
  const data = TOKEN_DATA[section] || [];
  const label = { colors: 'colors', dimensions: 'dimensions', typography: 'tokens', effects: 'effects' }[section] || 'tokens';
  searchEl.placeholder = `Search ${data.length} ${label}`;
}

// ── Render ────────────────────────────────────────────────────────────────────

function getFilteredTokens() {
  const data = TOKEN_DATA[section] || [];
  // When searching, bypass the group tab filter — search is top-level.
  const effectiveGroup = query ? 'all' : group;
  return data.filter(t => {
    if (effectiveGroup !== 'all' && t.group !== effectiveGroup) return false;
    if (query && !t.name.toLowerCase().includes(query) && !t.label.toLowerCase().includes(query)) return false;
    return true;
  });
}

function updateCount(n, total) {
  // Only relevant during active search — tabs already tell you how many on the tab.
  if (query) {
    searchCount.textContent = `${n}/${total}`;
    searchCount.classList.add('visible');
  } else {
    searchCount.classList.remove('visible');
  }
}

function render() {
  if (view === 'documentation') {
    searchCount.classList.remove('visible');
    subToolbar.classList.remove('searching');
    renderDocumentation();
    return;
  }

  const all = TOKEN_DATA[section] || [];
  const filtered = getFilteredTokens();
  updateCount(filtered.length, all.length);
  // Search bypasses the group tabs — reflect that visually in the sub-toolbar.
  subToolbar.classList.toggle('searching', !!query);

  if (filtered.length === 0) {
    contentEl.innerHTML = `<div class="empty-state"><p>No tokens match &ldquo;${escHtml(query)}&rdquo;</p><small>Try a different search</small></div>`;
    return;
  }

  switch (section) {
    case 'colors':     renderColors(filtered); break;
    case 'dimensions': renderDimensions(filtered); break;
    case 'typography': renderTypography(filtered); break;
    case 'effects':    renderEffects(filtered); break;
  }
}

function renderRecipeDetail(recipe) {

  const configuredGroups = RECIPE_VARIANT_GROUPS[recipe.id] || [];
  const groupedIds = new Set(configuredGroups.flatMap(group => group.ids));
  const ungroupedVariants = recipe.variants.filter(variant => !groupedIds.has(variant.id));
  const variantGroups = [
    ...configuredGroups.map(group => ({
      ...group,
      variants: group.ids.map(id => variantById.get(id)).filter(Boolean),
    })).filter(group => group.variants.length),
    ...(ungroupedVariants.length ? [{ label: 'Other variants', variants: ungroupedVariants }] : []),
  ];
  const recipeCategoryMeta = RECIPE_CATEGORIES.find(category => category.recipeIds.includes(recipe.id));
  const familyTarget = { color: 'color', typography: 'typography', elevation: 'effect' }[recipeCategoryMeta?.id];

  return `
    <article class="doc-recipe-detail">
      <div class="doc-recipe-heading">

        <p>${escHtml(recipe.summary)}</p>

        <div class="doc-kicker">Decision rule</div>

      <section class="doc-recipe-section" aria-label="Recipe fit">
        <div class="doc-columns">

        </div>
      </section>

      <section class="doc-recipe-section" aria-labelledby="docs-composition-rules-title">
        <h3 id="docs-composition-rules-title">Composition rules</h3>
        ${renderStringList(recipe.compositionRules)}
      </section>

      <section class="doc-recipe-section" aria-labelledby="docs-recipe-variants-title">
        <h3 id="docs-recipe-variants-title">Variants</h3>
        <div style="margin-top:16px">
          ${variantGroups.map(group => `
            <section class="doc-recipe-variant-group" aria-label="${escHtml(group.label)}">
              <div class="doc-recipe-variant-header"><h3>${escHtml(group.label)}</h3></div>
              <div class="doc-recipe-variant-grid">
                ${group.variants.map(renderRecipeVariant).join('')}

        </div>
      </section>

      ${(recipe.stateOwnership?.length || recipe.accessibility?.length) ? `
        <section class="doc-recipe-section" aria-label="Recipe guardrails">
          <div class="doc-columns">
            ${recipe.stateOwnership?.length ? `<div><h3>State ownership</h3>${renderStringList(recipe.stateOwnership)}</div>` : ''}
            ${recipe.accessibility?.length ? `<div><h3>Accessibility</h3>${renderStringList(recipe.accessibility)}</div>` : ''}
          </div>
        </section>` : ''}

      ${recipe.examples?.length ? `
        <section class="doc-recipe-section" aria-labelledby="docs-recipe-example-title">
          <h3 id="docs-recipe-example-title">Framework-neutral example</h3>
          ${recipe.examples.map(example => `<pre class="doc-code"><code>${escHtml(example.content)}</code></pre>`).join('')}
        </section>` : ''}

      <section class="doc-recipe-section" aria-label="Related guidance">
        <h3>Related guidance</h3>
        <div class="doc-family-recipes">
          ${recipeCategoryMeta?.id === 'color' ? `<button type="button" data-documentation-target="intents">Color intents</button>` : ''}
          ${familyTarget ? `<button type="button" data-family-target="${escHtml(familyTarget)}">${escHtml(recipeCategoryMeta.label)} families</button>` : ''}
        </div>
        ${renderReferences(recipe.references)}
      </section>
    </article>`;
}

function renderRecipeVariant(variant) {
  return `
    <div class="doc-variant">
      <div class="doc-variant-title">
        ${escHtml(variant.label)}
        ${variant.modifier ? `<span>${escHtml(variant.modifier)}</span>` : ''}
      </div>
      ${variant.when ? `<p style="margin-top:6px;color:var(--fg-muted);font-size:10px;line-height:15px">${escHtml(variant.when)}</p>` : ''}
      ${variant.assignments.map(assignment => `
        <div class="doc-assignment">
          <span>${escHtml(assignment.property)}</span>
          <code>${escHtml(assignment.token || assignment.tokenPattern || assignment.value)}</code>
        </div>`).join('')}
      ${variant.notes?.length ? renderStringList(variant.notes) : ''}
    </div>`;
}

function renderStringList(items) {
  return `<ul class="doc-list">${items.map(item => `<li>${escHtml(item)}</li>`).join('')}</ul>`;
}

function renderReferences(references) {
  if (!references?.length) return '';
  return `<h4>References</h4><ul class="doc-list">${references.map(reference => {
    const href = reference.path.startsWith('docs/') ? `./${reference.path.slice('docs/'.length)}` : reference.path;
    const external = href.startsWith('http') ? ' target="_blank" rel="noreferrer"' : '';
    return `<li><a class="doc-reference" href="${escHtml(href)}"${external}>${escHtml(reference.label)}</a></li>`;
  }).join('')}</ul>`;
}

function humanizeId(id) {
  return id.split(/[.-]/).map(word => word === 'ai' ? 'AI' : word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
}

// ── Colors ────────────────────────────────────────────────────────────────────

function renderColors(tokens) {
  const frag = document.createDocumentFragment();
  let lastCategory = null;
  let lastShade = null;
  let lastSubgroup = null;

  for (const t of tokens) {
    if (t.category && t.category !== lastCategory) {
      const h = document.createElement('div');
      h.className = 'color-group-header';
      h.textContent = humanizeColorCategory(t.category);
      frag.appendChild(h);
      lastCategory = t.category;
      lastShade = null;
      lastSubgroup = null;
    } else if (
      (t.shade && lastShade && t.shade !== lastShade) ||
      (t.subgroup && lastSubgroup && t.subgroup !== lastSubgroup)
    ) {
      // Same category, but a shade (dark → light) or data-palette step count
      // (e.g. diverging 5 → 7 → 9) flipped — force a line break so the next
      // sub-row starts cleanly under the previous one.
      const br = document.createElement('div');
      br.className = 'color-row-break';
      frag.appendChild(br);
    }
    if (t.shade)    lastShade = t.shade;
    if (t.subgroup) lastSubgroup = t.subgroup;

    const card = document.createElement('div');
    card.className = 'color-card';
    card.setAttribute('tabindex', '0');
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `${t.name} — click to copy`);
    // --sc is the swatch color; resolves through inlined token CSS
    card.innerHTML = `
      <div class="color-swatch" style="--sc:var(${t.name})"></div>
      <span class="color-label">${escHtml(t.label)}</span>`;
    addCopyHandler(card, `var(${t.name})`, t.name);
    frag.appendChild(card);
  }

  contentEl.className = 'color-grid';
  contentEl.innerHTML = '';
  contentEl.appendChild(frag);
}

function humanizeColorCategory(cat) {
  return cat.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

// ── Dimensions ────────────────────────────────────────────────────────────────

function renderDimensions(tokens) {
  // Compute max px per group for scaling bars
  const maxPx = {};
  for (const t of tokens) {
    if (t.px != null && t.px > 0) {
      if (!maxPx[t.group] || t.px > maxPx[t.group]) maxPx[t.group] = t.px;
    }
  }

  const frag = document.createDocumentFragment();
  // Show group headers when nothing narrows the view to a single group —
  // i.e. on the "all" tab, or whenever a search is active (which bypasses tabs).
  const showHeaders = group === 'all' || !!query;
  let lastGroup = null;

  for (const t of tokens) {
    if (showHeaders && t.group !== lastGroup) {
      const h = document.createElement('div');
      h.className = 'group-header';
      h.textContent = t.group;
      frag.appendChild(h);
      lastGroup = t.group;
    }

    const row = document.createElement('div');
    row.className = 'token-row';
    row.setAttribute('tabindex', '0');
    row.setAttribute('role', 'button');
    row.setAttribute('aria-label', `${t.name} — click to copy`);

    row.innerHTML = `
      <div class="tok-visual">${dimVisual(t, maxPx[t.group] || 1)}</div>
      <span class="tok-name">${escHtml(t.name)}</span>
      <span class="tok-value">${escHtml(formatDimValue(t))}</span>`;
    addCopyHandler(row, `var(${t.name})`, t.name);
    frag.appendChild(row);
  }

  contentEl.className = 'token-list';
  contentEl.innerHTML = '';
  contentEl.appendChild(frag);
}

function dimVisual(t, maxPx) {
  const px = t.px;

  switch (t.group) {
    case 'space':
    case 'offset': {
      if (px == null) return '';
      if (px === 0) return `<div class="dim-bar-track"><div class="dim-bar-fill" style="width:1px;opacity:0.2"></div></div>`;
      // Pure pixel-per-pixel bars — a 4px value shows a 4px bar, a 64px value
      // a 64px bar — clipped only at the 160px track edge. Scaling by the
      // group max made tiny values look identical to medium ones.
      const w = Math.max(1, Math.min(Math.abs(px), 160));
      const cls = px < 0 ? 'dim-bar-neg' : 'dim-bar-fill';
      return `<div class="dim-bar-track"><div class="${cls}" style="width:${w}px"></div></div>`;
    }
    case 'radius': {
      // Show the real radius on a larger sample box so 8/12/16px tokens read
      // as visibly different from 2/4px. "half" (9999px) stays a pill.
      if (px === 9999) return `<div class="dim-radius-box" style="border-radius:9999px"></div>`;
      const rad = px != null ? Math.min(px, 20) : 0;
      return `<div class="dim-radius-box" style="border-radius:${rad}px"></div>`;
    }
    case 'stroke': {
      if (px == null) return '';
      const h = Math.max(1, Math.min(px, 6));
      return `<div class="dim-stroke-line" style="height:${h}px"></div>`;
    }
    case 'size':
    case 'iconography': {
      // Show the actual pixel size (up to 64px — the top of the scale) so
      // e.g. size-800 (64px) renders as a 64px box instead of a capped 40px
      // square that looks identical to size-500.
      if (px == null) return '';
      const s = Math.min(px, 64);
      return `<div class="dim-size-box" style="width:${s}px;height:${s}px"></div>`;
    }
    case 'layout':
      // Layout widths (400–800px panel/card/modal widths, 100%, etc.) can't be
      // faithfully previewed at this grid's scale — the old bar compressed
      // them all into a ~150px stub, which was misleading. Show just the
      // numeric value in the existing value column.
      return '';
    case 'z-index':
    case 'scale':
      return `<div class="dim-zindex-pill">${escHtml(t.value)}</div>`;
    default:
      return '';
  }
}

function formatDimValue(t) {
  if (t.px != null) {
    if (t.group === 'z-index' || t.group === 'scale') return t.value;
    if (t.px === 9999) return '9999px (∞)';
    return t.px + 'px';
  }
  return t.value || '';
}

// ── Typography ────────────────────────────────────────────────────────────────

function renderTypography(tokens) {
  const frag = document.createDocumentFragment();
  // Show group headers when nothing narrows the view to a single group —
  // i.e. on the "all" tab, or whenever a search is active (which bypasses tabs).
  const showHeaders = group === 'all' || !!query;
  let lastGroup = null;

  for (const t of tokens) {
    if (t.group !== lastGroup) {
      if (showHeaders) {
        const h = document.createElement('div');
        h.className = 'group-header';
        h.textContent = typoGroupLabel(t.group);
        frag.appendChild(h);
      }
      if (t.group === 'textstyle') frag.appendChild(makeTextstyleNote());
      lastGroup = t.group;
    }

    if (t.group === 'textstyle') {
      frag.appendChild(makeTextstyleRow(t));
    } else {
      frag.appendChild(makeTypoRow(t));
    }
  }

  contentEl.className = 'token-list';
  contentEl.innerHTML = '';
  contentEl.appendChild(frag);
}

function typoGroupLabel(g) {
  return { fontsize: 'Font Size', lineheight: 'Line Height', weight: 'Font Weight',
           letterspacing: 'Letter Spacing', paragraphspacing: 'Paragraph Spacing',
           textstyle: 'Text Styles', other: 'Other' }[g] || g;
}

function makeTypoRow(t) {
  const row = document.createElement('div');
  row.className = 'token-row';
  row.setAttribute('tabindex', '0');
  row.setAttribute('role', 'button');
  row.setAttribute('aria-label', `${t.name} — click to copy`);

  row.innerHTML = `
    <div class="tok-visual">${typoVisual(t)}</div>
    <span class="tok-name">${escHtml(t.name)}</span>
    <span class="tok-value">${escHtml(t.value || '')}</span>`;
  addCopyHandler(row, `var(${t.name})`, t.name);
  return row;
}

function typoVisual(t) {
  switch (t.group) {
    case 'fontsize': {
      const sz = Math.min(t.numeric || 12, 44);
      // Cap display at 32px for very large sizes; show scaled down
      const display = sz > 32 ? 32 : sz;
      return `<span class="typo-sample" style="font-size:${display}px;opacity:${sz > 32 ? 0.7 : 1}">Ag</span>`;
    }
    case 'lineheight': {
      const lh = t.value || '16px';
      return `<span class="typo-sample" style="font-size:9px;line-height:${lh};display:inline-block;max-width:160px">Line one<br>Line two</span>`;
    }
    case 'weight': {
      return `<span class="typo-sample" style="font-size:16px;font-weight:${t.numeric || 400}">Ag</span>`;
    }
    case 'letterspacing': {
      return `<span class="typo-sample" style="font-size:11px;letter-spacing:${t.value || '0'}">ABCDEF</span>`;
    }
    case 'paragraphspacing': {
      if (!t.numeric) return `<span class="typo-sample" style="font-size:11px">—</span>`;
      const h = Math.min(t.numeric || 0, 12);
      return `<div style="display:flex;flex-direction:column;gap:0;font-size:9px;color:var(--fg)"><div>Paragraph one</div><div style="height:${h}px"></div><div>Paragraph two</div></div>`;
    }
    default:
      return `<span class="typo-sample">${escHtml(t.value || '')}</span>`;
  }
}

/** Explanatory line under a group header. `html` is trusted template content. */
function makeGroupNote(html) {
  const note = document.createElement('p');
  note.className = 'group-note';
  note.innerHTML = html;
  return note;
}

function makeTextstyleNote() {
  return makeGroupNote(
    'Recommended framework-neutral composites — these are <strong>not</strong> CSS classes. '
    + 'Every style has a regular and emphasis recipe; emphasis changes weight and tracking while size and line-height stay fixed. '
    + 'Copy a row to get its token-driven CSS declarations.'
  );
}

// TokoMo ships primitives rather than `.text-*` classes. The preview is composed
// from the validated framework-neutral recipe in @ds-mo/tokens/agent.
function makeTextstyleRow(t) {
  const row = document.createElement('div');
  row.className = 'textstyle-row';
  row.setAttribute('tabindex', '0');
  row.setAttribute('role', 'button');
  row.setAttribute('aria-label', `${t.snippet} — click to copy`);

  const style = [
    `font-family:var(${t.family})`,
    `font-size:var(--typography-fontsize-${t.size})`,
    `line-height:var(--typography-lineheight-${t.line})`,
    `font-weight:var(--typography-weight-${t.weight})`,
    `letter-spacing:var(--typography-letterspacing-${t.tracking})`,
    t.uppercase ? 'text-transform:uppercase' : '',
  ].filter(Boolean).join(';');

  row.innerHTML = `
    <div class="textstyle-sample" style="${escHtml(style)}">${escHtml(textstyleSample(t.name))}</div>
    <div class="textstyle-meta">
      <span class="textstyle-variant">${escHtml(t.name)} <em>${t.emphasis ? 'emphasis' : 'regular'}</em></span>
      <span class="textstyle-spec">${escHtml(`${t.size} / ${t.line} · ${t.weight} · ${t.tracking}`)}</span>
    </div>`;
  addCopyHandler(row, t.snippet, t.label);
  return row;
}

function textstyleSample(variant) {
  if (variant.includes('display')) return 'Display';
  if (variant.includes('title-large')) return 'Title Large';
  if (variant.includes('title-medium')) return 'Title Medium';
  if (variant.includes('title-small')) return 'Title Small';
  if (variant.includes('body-large')) return 'Body Large — The quick brown fox';
  if (variant.includes('body-medium')) return 'Body Medium — The quick brown fox';
  if (variant.includes('body-small')) return 'Body Small — The quick brown fox jumps over the lazy dog';
  if (variant.includes('caption')) return 'CAPTION TEXT';
  return 'Sample text';
}

// ── Effects ───────────────────────────────────────────────────────────────────

// Width of the time bar track, in px. Must match .fx-duration-track.
const FX_TRACK_W = 160;

// Longest time token across BOTH duration and delay, from the full dataset
// rather than the filtered view — otherwise the scale would silently rebase
// when you switch tabs or search, and the same token would draw two lengths.
function maxTimeToken() {
  const all = TOKEN_DATA.effects || [];
  return Math.max(
    ...all.filter(t => t.group === 'duration' || t.group === 'delay').map(t => t.numeric || 0),
    1
  );
}

function renderEffects(tokens) {
  const maxTime = maxTimeToken();

  const frag = document.createDocumentFragment();
  // Show group headers when nothing narrows the view to a single group —
  // i.e. on the "all" tab, or whenever a search is active (which bypasses tabs).
  const showHeaders = group === 'all' || !!query;
  let lastGroup = null;

  for (const t of tokens) {
    if (t.group !== lastGroup) {
      // The header is redundant on a single-group tab, but the note explains how
      // to read the visual — keep it even when the header is suppressed.
      if (showHeaders) {
        const h = document.createElement('div');
        h.className = 'group-header';
        h.textContent = fxGroupLabel(t.group);
        frag.appendChild(h);
      }
      const note = fxGroupNote(t.group, maxTime);
      if (note) frag.appendChild(note);
      lastGroup = t.group;
    }

    const row = document.createElement('div');
    row.className = 'token-row';
    row.setAttribute('tabindex', '0');
    row.setAttribute('role', 'button');
    row.setAttribute('aria-label', `${t.name} — click to copy`);

    row.innerHTML = `
      <div class="tok-visual">${fxVisual(t, maxTime)}</div>
      <span class="tok-name">${escHtml(t.name)}</span>
      <span class="tok-value">${escHtml(fxDisplayValue(t))}</span>`;
    addCopyHandler(row, `var(${t.name})`, t.name);
    frag.appendChild(row);
  }

  contentEl.className = 'token-list';
  contentEl.innerHTML = '';
  contentEl.appendChild(frag);
}

function fxGroupNote(g, maxTime) {
  if (g === 'duration' || g === 'delay') {
    return makeGroupNote(
      `Bar length is &radic;-scaled on one shared 0&ndash;${maxTime}ms scale, so duration `
      + 'and delay are directly comparable and the short steps stay legible. '
      + 'Exact values are on the right.'
    );
  }
  if (g === 'easing') {
    return makeGroupNote(
      'Each curve is plotted on the unit square it is defined on &mdash; progress runs '
      + 'left to right, output bottom to top. The dashed diagonal is linear, so '
      + 'deviation from it is the easing character.'
    );
  }
  if (g === 'elevation') {
    return makeGroupNote(
      'Each suffix exposes a public outer <code>shadow</code> part, inset <code>highlight</code> part, '
      + 'and combined <code>elevation</code> value. Default to the combined token; keep the same suffix '
      + 'when separate layers need different clipping or paint behavior.'
    );
  }
  return null;
}

function fxGroupLabel(g) {
  return { opacity: 'Opacity', duration: 'Duration', delay: 'Delay', easing: 'Easing',
           blur: 'Blur', elevation: 'Elevation', motion: 'Motion', transition: 'Transition',
           other: 'Other' }[g] || g;
}

function fxVisual(t, maxTime) {
  switch (t.group) {
    case 'duration':
    case 'delay': {
      const ms = t.numeric || 0;
      // Duration tops out at 2000ms but delay reaches 6000ms, so a linear map
      // against the duration-only max overflowed the track by 3x. Scale both
      // groups against the shared max instead — and use sqrt, because a linear
      // 0-6000ms map renders every sub-200ms step as a sub-pixel sliver.
      const w = ms === 0 ? 0 : Math.max(3, Math.round(Math.sqrt(ms / maxTime) * FX_TRACK_W));
      return `<div class="fx-duration-track"><div class="fx-duration-fill" style="width:${w}px"></div></div>`;
    }
    case 'easing': {
      // Extract cubic-bezier values for a mini SVG preview
      const cb = t.value && t.value.match(/cubic-bezier\(([\d., -]+)\)/);
      if (cb) {
        const [x1, y1, x2, y2] = cb[1].split(',').map(Number);
        return makeBezierSvg(x1, y1, x2, y2);
      }
      return `<div class="fx-easing-label">${escHtml(t.value || '')}</div>`;
    }
    case 'opacity': {
      // Foreground fill carrying the real token, so the step is the actual
      // rendered value rather than a hard-coded approximation of it.
      return `<div class="fx-opacity-box" style="opacity:var(${t.name})"></div>`;
    }
    case 'blur': {
      const b = t.numeric || 4;
      const blurPx = Math.min(b, 16);
      return `<div class="fx-blur-box" style="filter:blur(${blurPx}px);opacity:0.6"></div>`;
    }
    case 'elevation': {
      if (t.subgroup === 'atom') {
        // Color primitive — render as a swatch over a checker so alpha shows.
        return `<div class="fx-swatch"><div class="fx-swatch-fill" style="background:var(${t.name})"></div></div>`;
      }
      // Composite style: preview box with the actual shadow applied.
      return `<div class="fx-elevation-box" style="box-shadow:var(${t.name})"></div>`;
    }
    default:
      return '';
  }
}

function makeBezierSvg(x1, y1, x2, y2) {
  // A cubic-bezier is defined on a unit square, so the preview box must be
  // square. The old 40x24 box stretched x by 1.67x relative to y, which sheared
  // every curve and made the eases look shallower than they actually are.
  //
  // PAD adds vertical headroom so a curve that leaves the 0..1 range (a back
  // ease overshooting past 1) is not silently clipped flat at the frame edge.
  const S = 24, PAD = 4;
  const px = v => (v * S).toFixed(1);
  const py = v => (S - v * S).toFixed(1);

  // Progress runs bottom-left (0,0) to top-right (1,1); SVG y is flipped.
  const curve = `M0,${S} C${px(x1)},${py(y1)} ${px(x2)},${py(y2)} ${S},0`;

  return `<svg width="${S}" height="${S + PAD * 2}" viewBox="0 ${-PAD} ${S} ${S + PAD * 2}"
      fill="none" style="flex-shrink:0" aria-hidden="true">
    <path d="M0,${S} L${S},0" stroke="currentColor" stroke-width="1" opacity="0.25"
      stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>
    <path d="${curve}" stroke="currentColor" stroke-width="1" stroke-linecap="round"
      vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function fxDisplayValue(t) {
  if (t.group === 'duration' || t.group === 'delay') return t.value || '';
  if (t.group === 'easing') return t.value || '';
  if (t.group === 'blur') return t.value || '';
  if (t.group === 'motion') return t.value || '';
  if (t.group === 'elevation') {
    if (t.subgroup === 'atom') return t.value || '';
    if (t.subgroup === 'shadow') return '(outer shadow part)';
    if (t.subgroup === 'highlight') return '(inset highlight part)';
    return '(combined layers)';
  }
  if (t.group === 'transition') {
    // Shorten verbose transition values
    const short = t.label.replace('transition-interaction-', '').replace('--effect-', '');
    return short;
  }
  return t.value || '';
}

// ── Copy ──────────────────────────────────────────────────────────────────────

let toastTimer = null;

function addCopyHandler(el, copyText, label) {
  const doCopy = () => {
    const done = () => {
      el.style.background = 'var(--divider)';
      setTimeout(() => { el.style.background = ''; }, 600);
      showToast(copyText);
    };
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(copyText).then(done).catch(() => fallbackCopy(copyText, done));
    } else {
      fallbackCopy(copyText, done);
    }
  };
  el.addEventListener('click', doCopy);
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doCopy(); }
  });
}

function fallbackCopy(text, cb) {
  const el = document.createElement('textarea');
  el.value = text;
  el.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
  document.body.appendChild(el);
  el.select();
  try { document.execCommand('copy'); } catch (_) {}
  document.body.removeChild(el);
  cb();
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
}

// ── Utility ───────────────────────────────────────────────────────────────────

function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Init ──────────────────────────────────────────────────────────────────────

// Apply saved primary view state
primaryNav.querySelectorAll('[data-view]').forEach(btn => {
  btn.classList.toggle('active', btn.dataset.view === view);
});

searchWrap.classList.toggle('hidden', view !== 'browser');
updateSubToolbar();
updateSearchPlaceholder();
syncSearchWidth();
render();
</script>
